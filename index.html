<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suchu's Puzzle Kingdom</title>
    <style>
        :root { --gold: #F4D03F; --dark-gold: #B7950B; --bg: #121212; --panel: rgba(10,10,10,0.98); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        
        /* Map Screen */
        #map-screen { width: 100%; height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .lvl-card { width: 75px; height: 75px; background: #222; border: 2px solid #444; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.3s; position: relative; }
        .lvl-card.unlocked { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 15px rgba(244,208,63,0.2); }
        .lvl-card.locked { opacity: 0.4; pointer-events: none; }

        /* Game Screen */
        #game-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; align-items: center; }
        #header { width: 100%; padding: 10px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        
        #game-container { position: relative; border: 4px solid var(--gold); border-radius: 8px; background: #000; margin-top: 10px; overflow: hidden; }
        .tile { position: absolute; border: 0.5px solid rgba(255,255,255,0.2); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .tile span { display: none; font-weight: bold; text-shadow: 2px 2px 4px black; font-size: 1.2rem; pointer-events: none; }
        
        /* Neon Highlight for Block Mover */
        .selected { border: 4px solid #00FF00 !important; box-shadow: 0 0 25px #00FF00; filter: brightness(1.2); z-index: 50; animation: neon-pulse 1s infinite; }
        @keyframes neon-pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Robot icon */
        #robot-gfx { position: absolute; width: 60px; height: 60px; z-index: 200; pointer-events: none; display: none; transition: all 0.6s ease-in-out; filter: drop-shadow(0 0 10px cyan); }

        .btn { background: linear-gradient(145deg, var(--gold), var(--dark-gold)); border: none; color: black; padding: 8px 12px; border-radius: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #8a6d00; font-size: 0.75rem; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #8a6d00; }
        
        .booster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; width: 95%; }
        .badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 1px 5px; font-size: 0.6rem; border: 1px solid white; }

        .panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--panel); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .shop-row { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--gold); padding: 12px; margin: 4px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="map-header" style="width:100%; padding:15px; text-align:center; background:#000; border-bottom:2px solid var(--gold);">
    <h2 style="margin:0; color:var(--gold);">Kingdom Map</h2>
    <div style="color:var(--gold); font-size: 0.9rem;">💎 <span id="map-diamonds">100</span></div>
</div>
<div id="map-screen"></div>

<div id="game-screen">
    <div id="header">
        <div style="color:var(--gold); font-weight:bold;">💎 <span id="game-diamonds">100</span></div>
        <div style="color:white; font-weight:bold;">Lvl <span id="active-lvl">1</span> (<span id="stage-info">1/1</span>)</div>
        <button class="btn" style="padding:4px 8px;" onclick="closeGame()">Map</button>
    </div>

    <div id="game-container">
        <img id="robot-gfx" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
    </div>

    <div class="booster-grid">
        <button class="btn" style="position:relative" onclick="useBooster('robot')">🤖 Robot <span class="badge" id="b-robot">0</span></button>
        <button class="btn" style="position:relative" onclick="useBooster('swap')">🔄 Mover <span class="badge" id="b-swap">0</span></button>
        <button class="btn" style="position:relative" onclick="useBooster('eater')">🍴 Eater <span class="badge" id="b-eater">0</span></button>
        <button class="btn" style="position:relative" onclick="useBooster('shrink')">📏 Shrink <span class="badge" id="b-shrink">0</span></button>
        <button class="btn" style="position:relative" onclick="useBooster('army')">🔢 Army <span class="badge" id="b-army">0</span></button>
        <button class="btn" onclick="toggleRef()">🖼 View</button>
    </div>

    <div style="margin-top: 15px; display: flex; gap: 10px; width: 95%;">
        <button class="btn" style="flex:1; background:#222; color:var(--gold); border: 1px solid var(--gold);" onclick="openPanel('shop-panel')">🛒 STORE</button>
        <button class="btn" style="flex:1; background:#222; color:var(--gold); border: 1px solid var(--gold);" onclick="openPanel('wheel-panel')">🎡 WHEEL</button>
    </div>
</div>

<!-- Shop -->
<div id="shop-panel" class="panel">
    <h2 style="color:var(--gold)">Suchu's Store</h2>
    <div class="shop-row"><span>🤖 Robot (25💎)</span> <button class="btn" onclick="buy('robot', 25)">Buy</button></div>
    <div class="shop-row"><span>🔄 Block Mover (10💎)</span> <button class="btn" onclick="buy('swap', 10)">Buy</button></div>
    <div class="shop-row"><span>🍴 Stage Eater (25💎)</span> <button class="btn" onclick="buy('eater', 25)">Buy</button></div>
    <div class="shop-row"><span>📏 Shrink (15💎)</span> <button class="btn" onclick="buy('shrink', 15)">Buy</button></div>
    <div class="shop-row"><span>🔢 Number Army (20💎)</span> <button class="btn" onclick="buy('army', 20)">Buy</button></div>
    <button class="btn" style="width:100%; margin-top:20px;" onclick="closePanels()">Back to Game</button>
</div>

<!-- Wheel -->
<div id="wheel-panel" class="panel">
    <h2 style="color:var(--gold)">Lucky Wheel</h2>
    <div id="wheel-msg" style="height:100px; display:flex; align-items:center; font-size:1.4rem; color:var(--gold); text-align:center;">Win Boosters!</div>
    <button class="btn" style="width:80%; padding:15px;" onclick="spin()">SPIN</button>
    <button class="btn" style="width:80%; margin-top:10px; background:#444; color:white;" onclick="closePanels()">Close</button>
</div>

<img id="ref-img" src="" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); width:80%; z-index:1000; border:4px solid var(--gold); transition:0.3s;" onclick="toggleRef()">

<script>
    let diamonds = 100, inventory = { robot: 2, swap: 2, eater: 2, shrink: 1, army: 1 };
    let highestLvl = parseInt(localStorage.getItem('suchu_lvl_v7')) || 1;
    let curLvl = 1, curStage = 1, totalStages = 1, gSize = 4;
    let tiles = [], empty = {r:0, c:0}, swapping = false, selection = [];
    const imgs = Array.from({length: 100}, (_, i) => `https://picsum.photos/seed/${i + 100}/600/600`);

    function initMap() {
        const map = document.getElementById('map-screen'); map.innerHTML = "";
        for(let i=1; i<=50; i++) {
            const card = document.createElement('div');
            card.className = `lvl-card ${i <= highestLvl ? 'unlocked' : 'locked'}`;
            card.innerText = i;
            if(i <= highestLvl) card.onclick = () => { curLvl = i; curStage = 1; startLvl(); };
            map.appendChild(card);
        }
        updateUI();
    }

    function startLvl() {
        document.getElementById('game-screen').style.display = 'flex';
        const bSize = Math.min(window.innerWidth - 40, 350);
        const container = document.getElementById('game-container');
        container.style.width = container.style.height = bSize + 'px';
        
        if (curLvl % 5 === 0) { gSize = 5; totalStages = 3; }
        else if (curLvl % 5 >= 3) { gSize = 5; totalStages = 2; }
        else { gSize = 4; totalStages = 1; }

        createBoard(bSize);
        shuffle();
        updateUI();
    }

    function createBoard(bSize) {
        const container = document.getElementById('game-container');
        container.innerHTML = '<img id="robot-gfx" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">';
        tiles = [];
        const tSize = bSize / gSize;
        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                if(r === gSize-1 && c === gSize-1) { empty = {r,c}; continue; }
                const el = document.createElement('div'); el.className = 'tile';
                el.style.width = el.style.height = tSize+'px';
                el.style.backgroundImage = `url(${imgs[(curLvl + curStage) % 100]})`;
                el.style.backgroundSize = `${bSize}px ${bSize}px`;
                el.style.backgroundPosition = `-${c*tSize}px -${r*tSize}px`;
                const span = document.createElement('span'); span.innerText = (r*gSize)+c+1;
                el.appendChild(span);
                const obj = { el, r, c, orgR: r, orgC: c };
                el.onclick = () => tapTile(obj);
                container.appendChild(el); tiles.push(obj);
            }
        }
        draw();
    }

    function tapTile(t) {
        if(swapping) {
            t.el.classList.add('selected'); selection.push(t);
            if(selection.length === 2) {
                const t1 = selection[0], t2 = selection[1];
                const tr = t1.r, tc = t1.c; t1.r = t2.r; t1.c = t2.c; t2.r = tr; t2.c = tc;
                draw();
                t1.el.classList.remove('selected'); t2.el.classList.remove('selected');
                swapping = false; selection = []; checkWin();
            }
            return;
        }
        const dr = Math.abs(t.r-empty.r), dc = Math.abs(t.c-empty.c);
        if((dr==1 && dc==0) || (dr==0 && dc==1)) {
            const tr = t.r, tc = t.c; t.r = empty.r; t.c = empty.c; empty.r = tr; empty.c = tc;
            draw(); checkWin();
        }
    }

    function draw() {
        const ts = parseInt(tiles[0].el.style.width);
        tiles.forEach(t => { t.el.style.left = (t.c*ts)+'px'; t.el.style.top = (t.r*ts)+'px'; });
    }

    function useBooster(type) {
        if(inventory[type] > 0) {
            if(type === 'army') { 
                const s = tiles[0].el.querySelector('span').style.display === 'block';
                tiles.forEach(t => t.el.querySelector('span').style.display = s ? 'none' : 'block');
                if(!s) inventory.army--;
            }
            else if(type === 'shrink') { gSize = Math.max(3, gSize-1); inventory.shrink--; startLvl(); }
            else if(type === 'swap') { swapping = true; alert("Select 2 tiles to swap!"); inventory.swap--; }
            else if(type === 'robot') { botMove(); inventory.robot--; }
            else if(type === 'eater') { inventory.eater--; handleVictory(); }
            updateUI();
        } else openPanel('shop-panel');
    }

    function botMove() {
        const bot = document.getElementById('robot-gfx');
        const wrong = tiles.filter(t => t.r !== t.orgR || t.c !== t.orgC);
        if(wrong.length === 0) return;
        const target = wrong[0];
        bot.style.display = 'block'; bot.style.left = "-80px"; bot.style.top = "50%";
        setTimeout(() => {
            bot.style.left = target.el.style.left; bot.style.top = target.el.style.top;
            setTimeout(() => {
                target.r = target.orgR; target.c = target.orgC; draw();
                bot.style.top = "-80px";
                setTimeout(() => { bot.style.display = 'none'; checkWin(); }, 500);
            }, 600);
        }, 100);
    }

    function shuffle() {
        for(let i=0; i<100; i++) {
            const adj = tiles.filter(t => (Math.abs(t.r-empty.r)==1 && t.c==empty.c) || (Math.abs(t.c-empty.c)==1 && t.r==empty.r));
            const p = adj[Math.floor(Math.random()*adj.length)];
            const tr = p.r, tc = p.c; p.r = empty.r; p.c = empty.c; empty.r = tr; empty.c = tc;
        }
        draw();
    }

    function checkWin() {
        if(tiles.every(t => t.r === t.orgR && t.c === t.orgC)) {
            setTimeout(handleVictory, 400);
        }
    }

    function handleVictory() {
        if (curStage < totalStages) {
            alert(`Stage ${curStage} Clear!`);
            curStage++;
            startLvl();
        } else {
            alert("Level Complete!");
            if(curLvl === highestLvl) { highestLvl++; localStorage.setItem('suchu_lvl_v7', highestLvl); }
            closeGame();
            initMap();
        }
    }

    function updateUI() {
        document.getElementById('map-diamonds').innerText = diamonds;
        document.getElementById('game-diamonds').innerText = diamonds;
        document.getElementById('active-lvl').innerText = curLvl;
        document.getElementById('stage-info').innerText = `${curStage}/${totalStages}`;
        for(let b in inventory) document.getElementById('b-'+b).innerText = inventory[b];
    }

    function spin() {
        const res = ["10💎", "Robot", "Mover", "Nothing", "Eater", "20💎"][Math.floor(Math.random()*6)];
        document.getElementById('wheel-msg').innerText = "SPINNING...";
        setTimeout(() => {
            document.getElementById('wheel-msg').innerText = "WON: " + res;
            if(res.includes("💎")) diamonds += parseInt(res);
            else if(res !== "Nothing") {
                const key = res === 'Mover' ? 'swap' : res.toLowerCase();
                inventory[key]++;
            }
            updateUI();
        }, 1500);
    }

    function buy(type, cost) { if(diamonds >= cost) { diamonds -= cost; inventory[type]++; updateUI(); } else alert("No 💎!"); }
    function openPanel(id) { document.getElementById(id).style.display = 'flex'; }
    function closePanels() { document.querySelectorAll('.panel').forEach(p => p.style.display='none'); }
    function closeGame() { document.getElementById('game-screen').style.display='none'; }
    function toggleRef() { const r = document.getElementById('ref-img'); r.src = imgs[(curLvl + curStage) % 100]; r.style.transform = r.style.transform.includes('scale(0)') ? 'translate(-50%,-50%) scale(1)' : 'translate(-50%,-50%) scale(0)'; }

    window.onload = initMap;
</script>
</body>
</html>
